<title>Ember Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench — the live campfire and lists on the left, the selected thing's form on the right. */
:root {
  --bg: #0f0b09; --panel: #19130f; --panel-2: #221a15; --line: #3a2c22; --line-hi: #5a4330;
  --text: #f0e2cb; --muted: #a8937a; --dim: #6f5e4d;
  --ember: #ff8a3a; --amber: #ffc46b; --good: #8fd27a; --bad: #ff6e5e; --warn: #f2c14e; --focus: #ffd38a;
  --pixel: 'Silkscreen', 'Courier New', monospace;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--pixel); font-weight: 400; font-size: 20px; letter-spacing: 2px; color: var(--amber); text-shadow: 0 0 12px rgba(255, 138, 58, .45); }
.brand .sub { color: var(--muted); font-size: 13px; }
.brand .spacer { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.status.saved i { background: var(--good); } .status.saving i { background: var(--warn); } .status.local i { background: var(--ember); } .status.error i { background: var(--bad); }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 14px; color: var(--muted); font-family: var(--pixel); font-size: 12px; letter-spacing: 1px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--amber); border-bottom-color: var(--ember); }
.tab .n { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: 4px; }

/* workbench */
.bench { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 20px; margin-top: 18px; align-items: start; }
.bench.campsite { grid-template-columns: minmax(0, 380px) minmax(0, 1fr); }
@media (max-width: 820px) { .bench, .bench.campsite { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .brand .sub { display: none; } .brand h1 { font-size: 16px; } .top { padding-block: 10px 0; } .tabs { margin-top: 6px; } }
.side { display: grid; gap: 12px; min-width: 0; }
.form { min-width: 0; display: grid; gap: 16px; }

.list { display: grid; gap: 2px; max-height: 62vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 4px; }
.row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 4px; border: 0; background: none; text-align: left; width: 100%; }
.row:hover { background: var(--panel-2); }
.row[aria-current="true"] { background: #2e2118; box-shadow: inset 2px 0 0 var(--ember); }
.row img { width: 32px; height: 32px; object-fit: contain; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.row .badge { font-size: 10px; font-family: var(--mono); color: var(--ember); }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.list-head h2 { font-family: var(--pixel); font-weight: 400; font-size: 12px; letter-spacing: 1px; color: var(--muted); }

.card { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card > h3 { font-family: var(--pixel); font-weight: 400; font-size: 11px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
.card .help { color: var(--muted); font-size: 12.5px; margin: -6px 0 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px 14px; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f .u { color: var(--dim); }
input[type=text], input[type=number], select, textarea { width: 100%; background: #120d0a; border: 1px solid var(--line-hi); border-radius: 4px; padding: 7px 9px; color: var(--text); min-width: 0; }
input[type=number], .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
textarea { min-height: 70px; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--ember); }
input[type=checkbox] { accent-color: var(--ember); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--line-hi); background: var(--panel-2); color: var(--text); font-size: 13px; }
.btn:hover { border-color: var(--amber); }
.btn.primary { background: linear-gradient(#ff9a42, #e0661e); border-color: #000; color: #2a0e02; font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.on { border-color: var(--ember); color: var(--amber); }

table.rows { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rows th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 0 6px 6px; }
table.rows td { padding: 3px 6px; vertical-align: middle; }
table.rows td.x { width: 1%; }
.tablewrap { overflow-x: auto; }

.head { display: flex; gap: 14px; align-items: center; }
.head img { width: 64px; height: 64px; object-fit: contain; background: #120d0a; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.head h2 { font-size: 20px; font-weight: 600; }
.head .id { font-family: var(--mono); color: var(--dim); font-size: 12px; }
.pill { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line-hi); color: var(--muted); }
.pill.new { color: var(--good); border-color: #3c5a30; } .pill.changed { color: var(--amber); border-color: #6a4a20; }

/* campfire preview */
.stage { position: relative; width: 100%; max-width: 380px; aspect-ratio: 390 / 700; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .covered { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(rgba(8,5,4,0), rgba(8,5,4,.82) 28px, rgba(8,5,4,.9)); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; color: var(--dim); font-size: 11px; pointer-events: none; }
.stage .hint { position: absolute; top: 8px; left: 8px; right: 8px; color: var(--muted); font-size: 11px; text-shadow: 0 1px 0 #000; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line-hi); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 5px 9px; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: #3a2616; color: var(--amber); }

/* pixel editor */
.pe { display: grid; gap: 10px; }
.pe-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pe-canvaswrap { overflow: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #0b0807; padding: 8px; }
.pe-canvas { display: block; touch-action: none; cursor: crosshair; }
.pe-pal { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { position: relative; width: 30px; height: 30px; border-radius: 4px; border: 2px solid var(--line-hi); padding: 0; overflow: hidden; }
.chip[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 2px #000 inset; }
.chip input[type=color] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; pointer-events: none; }
.chip .k { position: absolute; right: 2px; bottom: 0; font-family: var(--mono); font-size: 9px; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; pointer-events: none; }
.pe-import { border: 1px dashed var(--line-hi); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.pe-import .previews { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.pe-import img, .pe-import canvas { max-width: 160px; max-height: 160px; background: repeating-conic-gradient(#2a221c 0 25%, #1c1612 0 50%) 0 0 / 12px 12px; border-radius: 4px; }

/* checks */
.issues { display: grid; gap: 6px; }
.issue { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; font-size: 13px; padding: 7px 10px; border-radius: 4px; background: var(--panel-2); }
.issue b { font-family: var(--mono); font-size: 11px; font-weight: 500; }
.issue.error b { color: var(--bad); } .issue.warn b { color: var(--warn); }
.ok { color: var(--good); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.summary div { background: var(--panel-2); border-radius: 6px; padding: 10px 12px; }
.summary b { display: block; font-family: var(--pixel); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
.summary span { font-family: var(--mono); font-size: 13px; }
pre.json { max-height: 280px; overflow: auto; background: #0b0807; border: 1px solid var(--line); border-radius: 4px; padding: 10px; font-family: var(--mono); font-size: 11.5px; white-space: pre; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
code { font-family: var(--mono); font-size: 12.5px; background: #0b0807; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #2a1d14; border: 1px solid var(--line-hi); border-radius: 6px; padding: 9px 14px; font-size: 13px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: calc(100% - 32px); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="top">
  <div class="brand">
    <h1>EMBER WORKSHOP</h1>
    <span class="sub">Edit and add to Embers: campsite art, fuel, ash finds and upgrades.</span>
    <span class="spacer"></span>
    <span class="status" id="status" role="status"><i></i><span>Loading your workshop…</span></span>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------------------------------------------------------------- game code + data, bundled at build time */
const GAME = /*__GAME__*/null;
/*__SCENE_LIB__*/
/*__ICONS_LIB__*/
</script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const slug = (s) => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
const round = (n, d = 2) => Math.round(n * 10 ** d) / 10 ** d;
const KEYS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

const BASE = GAME.data;
const CONFIG = BASE.config;
const RARITIES = CONFIG.rarities;
const CATEGORIES = CONFIG.categories;
const LAYERS = CONFIG.overlayLayers || ['sky', 'ground-back', 'ground-front', 'overlay'];
const LAYER_NAMES = { sky: 'Sky (behind the trees)', 'ground-back': 'Ground, behind the stones', 'ground-front': 'Ground, in front of the stones', overlay: 'Over everything' };
const SPRITE_NAMES = Object.keys(GAME.sprites);
const SHAPES = IconsLib.ICON_SHAPES;
const EFFECTS = {
  capacity: 'Stoking slots (uses the capacity table in config)',
  burnCategory: 'Longer burn for one category',
  burnAll: 'Longer burn for everything',
  heat: 'More heat', quality: 'More quality',
  preservation: 'Earlier stoking + more essence',
  rolls: 'More reward rolls',
  rarityChance: 'Better chance for chosen rarities',
  tagChance: 'Better chance for heat or magic finds',
  forageFinds: 'Extra finds on the forage patch',
};

/* ---------------------------------------------------------------- working copy */
function fromBase() {
  return {
    materials: clone(BASE.materials), items: clone(BASE.items), upgrades: clone(BASE.upgrades),
    overlays: clone(BASE.overlays), groups: clone(CONFIG.upgradeGroups || []),
  };
}
let work = fromBase();
const COLLECTIONS = ['materials', 'items', 'upgrades', 'overlays', 'groups'];
let tab = 'campsite';
const sel = { campsite: 0, materials: 0, items: 0, upgrades: 0 };
const isNew = new Set(); // "materials:3" — ids still editable until saved once
let pendingDelete = null;

function listFor(t) { return t === 'campsite' ? work.overlays : work[t]; }
function cur() { const l = listFor(tab); return l ? l[sel[tab]] : undefined; }
function allIds() { return new Set([...work.materials.map((m) => m.id), ...work.items.map((i) => i.id)]); }
function itemById(id) { return work.materials.find((m) => m.id === id) || work.items.find((i) => i.id === id); }
function uniqueId(base, taken) { let id = slug(base) || 'new'; let n = 2; while (taken.has(id)) id = `${slug(base)}_${n++}`; return id; }

/* ---------------------------------------------------------------- icons */
function iconSrc(def) { try { return IconsLib.iconUrl(def); } catch { return ''; } }
function upgradeIconSrc(u) {
  try {
    if (u.iconArt) return IconsLib.artUrl(u.iconArt);
    if (u.iconSprite) return GAME.sprites[u.iconSprite] || '';
    const g = work.groups.find((x) => x.id === u.group);
    return IconsLib.uiIconUrl(u.icon || 'flame', (g && g.iconPalette) || ['#1a0c06', '#6a2e10', '#c0602a', '#f0a040', '#ffe6a0']);
  } catch { return ''; }
}
function overlaySrc(o) {
  try { return o.art ? IconsLib.artUrl(o.art) : GAME.sprites[o.sprite] || ''; } catch { return ''; }
}

/* ---------------------------------------------------------------- saving: the artifact's store (Claude can read it) */
let db = null;
let dbState = 'connecting';
const lastSaved = {}; // collection -> JSON string last written
let saveTimer = null;
let saving = false;
const LS_KEY = 'ember-workshop-draft';

function setStatus(kind, text) {
  const el = $('#status');
  el.className = `status ${kind}`;
  el.lastElementChild.textContent = text;
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}
function scheduleSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(work)); } catch { /* storage may be blocked */ }
  if (!db) { if (dbState !== 'connecting') setStatus('local', 'Changes kept in this browser only'); return; }
  setStatus('saving', 'Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}
async function saveNow() {
  if (!db || saving) { if (saving) saveTimer = setTimeout(saveNow, 800); return; }
  saving = true;
  try {
    for (const k of COLLECTIONS) {
      const body = JSON.stringify(work[k]);
      if (body === lastSaved[k]) continue;
      if (body.length > 250000) throw Object.assign(new Error(`${k} is too large to save (${Math.round(body.length / 1024)} KB). Make some pixel art smaller.`), { code: 'too_big' });
      await db.doc(`workshop/${k}`).set({ list: work[k], savedAt: new Date().toISOString() });
      lastSaved[k] = body;
    }
    await db.doc('workshop/meta').set({ format: 'embers-workshop', version: 1, savedAt: new Date().toISOString() });
    setStatus('saved', 'Saved · Claude can apply it');
  } catch (err) {
    const code = err && err.code;
    if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') setStatus('error', 'You can view this workshop but not save to it');
    else if (code === 'too_big') setStatus('error', err.message);
    else setStatus('error', 'Not saved yet — will retry on your next change');
  } finally { saving = false; }
}
async function connect() {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (!db) {
    dbState = 'none';
    let restored = false;
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const w = JSON.parse(raw); if (w && w.materials) { work = { ...fromBase(), ...w }; restored = true; } }
    } catch { /* ignore */ }
    setStatus('local', restored ? 'Restored from this browser · not shared' : 'Changes kept in this browser only');
    if (restored) render();
    return;
  }
  dbState = 'connected';
  setStatus('saving', 'Opening your saved workshop…');
  const timer = setTimeout(() => setStatus('error', 'The store is slow to answer — showing the game\'s data'), 10000);
  try {
    const snaps = await Promise.all(COLLECTIONS.map((k) => db.doc(`workshop/${k}`).get()));
    clearTimeout(timer);
    let any = false;
    snaps.forEach((snap, i) => {
      const k = COLLECTIONS[i];
      if (snap.exists && Array.isArray(snap.data().list)) { work[k] = clone(snap.data().list); lastSaved[k] = JSON.stringify(work[k]); any = true; }
    });
    setStatus('saved', any ? 'Saved · Claude can apply it' : 'Starting from the game\'s current data');
    render();
  } catch {
    clearTimeout(timer);
    setStatus('error', 'Could not open the saved workshop — showing the game\'s data');
  }
}

/* ---------------------------------------------------------------- value binding */
const toVal = {
  text: (v) => v, int: (v) => parseInt(v, 10) || 0, num: (v) => parseFloat(v) || 0,
  pct: (v) => round((parseFloat(v) || 0) / 100, 4), min: (v) => Math.round((parseFloat(v) || 0) * 60), hrs: (v) => Math.round((parseFloat(v) || 0) * 3600),
  'null-int': (v) => (v === '' ? null : parseInt(v, 10) || 0), 'opt-min': (v) => (v === '' ? undefined : Math.round((parseFloat(v) || 0) * 60)),
  'opt-text': (v) => (v === '' ? undefined : v),
  'opt-int': (v) => (v === '' ? undefined : parseInt(v, 10) || 0), 'opt-pct': (v) => (v === '' ? undefined : round((parseFloat(v) || 0) / 100, 4)),
};
const fromVal = {
  text: (v) => v ?? '', int: (v) => v ?? 0, num: (v) => v ?? 0, pct: (v) => round((v ?? 0) * 100, 2), min: (v) => round((v ?? 0) / 60, 2),
  hrs: (v) => round((v ?? 0) / 3600, 2), 'null-int': (v) => (v == null ? '' : v), 'opt-min': (v) => (v == null ? '' : round(v / 60, 2)), 'opt-text': (v) => v ?? '',
  'opt-int': (v) => (v == null ? '' : v), 'opt-pct': (v) => (v == null ? '' : round(v * 100, 2)),
};
function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) {
  const ks = path.split('.'); let t = o;
  for (let i = 0; i < ks.length - 1; i++) { if (t[ks[i]] == null) t[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; t = t[ks[i]]; }
  const last = ks[ks.length - 1];
  if (v === undefined) delete t[last]; else t[last] = v;
}
function field(label, path, type = 'text', attrs = '', unit = '') {
  const v = fromVal[type](getPath(cur(), path));
  const inputType = ['text', 'opt-text'].includes(type) ? 'text' : 'number';
  return `<label class="f">${esc(label)}${unit ? ` <span class="u">(${esc(unit)})</span>` : ''}<input type="${inputType}" data-k="${path}" data-t="${type}" value="${esc(v)}" ${attrs}></label>`;
}
function selectField(label, path, options, attrs = '') {
  const v = getPath(cur(), path) ?? '';
  return `<label class="f">${esc(label)}<select data-k="${path}" data-t="opt-text" ${attrs}>${options.map(([val, name]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select></label>`;
}
function onFormInput(e) {
  const el = e.target.closest('[data-k]');
  if (!el || !cur()) return;
  const type = el.dataset.t || 'text';
  const raw = el.type === 'checkbox' ? el.checked : el.value;
  const v = el.type === 'checkbox' ? raw : toVal[type](raw);
  const prevId = cur().id;
  setPath(cur(), el.dataset.k, v);
  if (el.dataset.k === 'id') renameId(prevId, el.value);
  afterChange({ soft: true });
}

/* ---------------------------------------------------------------- render */
const TABS = [['campsite', 'Campsite'], ['materials', 'Materials'], ['items', 'Ash items'], ['upgrades', 'Upgrades'], ['check', 'Check & export']];
function renderTabs() {
  const counts = { campsite: work.overlays.length, materials: work.materials.length, items: work.items.length, upgrades: work.upgrades.length };
  $('#tabs').innerHTML = TABS.map(([id, name]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${tab === id}">${esc(name)}${counts[id] != null ? `<span class="n">${counts[id]}</span>` : ''}</button>`).join('');
}
function render() {
  renderTabs();
  stopPreviewIfHidden();
  const main = $('#main');
  if (tab === 'check') { main.innerHTML = renderCheck(); bindCheck(); return; }
  if (tab === 'campsite') {
    main.innerHTML = `<div class="bench campsite"><div class="side" id="side"></div><div class="form" id="form"></div></div>`;
    renderCampsiteSide();
  } else {
    main.innerHTML = `<div class="bench"><div class="side" id="side"></div><div class="form" id="form"></div></div>`;
    renderListSide();
  }
  renderForm();
}
function afterChange({ soft = false, list = true } = {}) {
  if (list) refreshList();
  scheduleSave();
  if (tab === 'campsite') pushPreview();
  if (!soft) renderForm();
  else refreshHead();
}
function statusPill(t, o) {
  const baseList = t === 'campsite' ? BASE.overlays : BASE[t] || CONFIG.upgradeGroups;
  const b = baseList.find((x) => x.id === o.id);
  if (!b) return '<span class="pill new">new</span>';
  return JSON.stringify(b) === JSON.stringify(o) ? '' : '<span class="pill changed">edited</span>';
}

/* list column (materials, items, upgrades) */
function rowHtml(t, o, i) {
  let src = ''; let meta = '';
  if (t === 'materials') { src = iconSrc(o); meta = `${round(o.burnSeconds / 60, 1)}m · ${o.rarity}`; }
  else if (t === 'items') { src = iconSrc(o); meta = `${o.kind === 'core' ? 'Ember Core' : `✦${o.value}`} · ${o.rarity}`; }
  else if (t === 'upgrades') { src = upgradeIconSrc(o); meta = `${(work.groups.find((g) => g.id === o.group) || {}).name || o.group} · ${o.costs.length} lvl`; }
  else { src = overlaySrc(o); meta = LAYER_NAMES[o.layer] || o.layer; }
  return `<button class="row" data-sel="${i}" aria-current="${sel[tab] === i}"><img class="px" src="${src}" alt=""><span><span class="nm">${esc(o.name || o.id)}</span><br><span class="meta">${esc(meta)}</span></span><span class="badge">${statusPill(t, o)}</span></button>`;
}
function renderListSide() {
  const names = { materials: 'Materials', items: 'Ash items', upgrades: 'Upgrades' };
  const add = { materials: 'New material', items: 'New ash item', upgrades: 'New upgrade' };
  $('#side').innerHTML = `
    <div class="list-head"><h2>${names[tab]}</h2><button class="btn small" data-act="add">+ ${add[tab]}</button></div>
    <div class="list" id="list">${listFor(tab).map((o, i) => rowHtml(tab, o, i)).join('')}</div>
    ${tab === 'upgrades' ? '<button class="btn small" data-act="groups">Edit upgrade sections</button>' : ''}`;
}
function refreshList() {
  renderTabs();
  const list = $('#list');
  if (list) list.innerHTML = listFor(tab).map((o, i) => rowHtml(tab, o, i)).join('');
}
function refreshHead() {
  const o = cur(); const h = $('#head');
  if (!o || !h) return;
  const img = $('img', h);
  if (img) img.src = tab === 'upgrades' ? upgradeIconSrc(o) : tab === 'campsite' ? overlaySrc(o) : iconSrc(o);
  $('h2', h).textContent = o.name || o.id;
}

function renderForm() {
  const form = $('#form');
  if (!form) return;
  pendingDelete = null;
  if (tab === 'upgrades' && sel.upgrades === -1) { form.innerHTML = groupsForm(); return; }
  const o = cur();
  if (!o) { form.innerHTML = `<div class="card"><h3>Nothing here yet</h3><p class="help">Use the button on the left to add one.</p></div>`; return; }
  if (tab === 'materials') form.innerHTML = materialForm(o);
  else if (tab === 'items') form.innerHTML = itemForm(o);
  else if (tab === 'upgrades') form.innerHTML = upgradeForm(o);
  else form.innerHTML = overlayForm(o);
  mountPixelEditors();
}
function headHtml(src, o, extra = '') {
  return `<div class="head" id="head"><img class="px" src="${src}" alt=""><div><h2>${esc(o.name || o.id)}</h2><div class="id">${esc(o.id)} ${extra}</div></div></div>`;
}
function idField(t) {
  const key = `${t}:${sel[t]}`;
  return isNew.has(key)
    ? field('ID (used in saves — set it before saving the game)', 'id', 'text', 'pattern="[a-z0-9_]+" spellcheck="false"')
    : `<label class="f">ID<input type="text" value="${esc(cur().id)}" disabled title="IDs of things already in the game stay fixed, so players' saves keep working"></label>`;
}
function renameId(before, raw) {
  const o = cur();
  const next = slug(raw);
  o.id = next;
  // keep references to this id pointing at it
  if (tab === 'materials' || tab === 'items') {
    for (const m of work.materials) for (const l of m.loot) if (l.item === before) l.item = next;
    for (const u of work.upgrades) if (u.effect && u.effect.finds) for (const f of u.effect.finds) if (f.id === before) f.id = next;
  }
  if (tab === 'upgrades') for (const ov of work.overlays) if (ov.requires && ov.requires.upgrade === before) ov.requires.upgrade = next;
}
function deleteBlock(label) {
  return `<div class="card"><h3>Remove</h3><div class="inline" id="delzone"><button class="btn danger" data-act="del">Delete ${esc(label)}</button><button class="btn" data-act="dup">Duplicate</button></div></div>`;
}

/* materials */
function unlockFields(o) {
  const u = o.unlock || null;
  const kind = !u ? '' : u.firesCompleted !== undefined ? 'firesCompleted' : u.milestone ? 'milestone' : u.discovered ? 'discovered' : u.longestFire !== undefined ? 'longestFire' : u.burned ? 'burned' : '';
  let val = '';
  if (kind === 'firesCompleted') val = `<label class="f">Fires burned out<input type="number" min="0" data-unlock="firesCompleted" value="${u.firesCompleted}"></label>`;
  if (kind === 'burned') val = `<label class="f">Material burned<select data-unlock="burned">${work.materials.filter((m) => m !== o).map((m) => `<option value="${m.id}" ${u.burned === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>`;
  if (kind === 'milestone') val = `<label class="f">Milestone<select data-unlock="milestone">${BASE.milestones.map((m) => `<option value="${m.id}" ${u.milestone === m.id ? 'selected' : ''}>${esc(m.name)} (${round(m.seconds / 3600, 1)}h)</option>`).join('')}</select></label>`;
  if (kind === 'discovered') val = `<label class="f">Found in the ashes<select data-unlock="discovered">${[...work.items, ...work.materials].map((d) => `<option value="${d.id}" ${u.discovered === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>`;
  if (kind === 'longestFire') val = `<label class="f">Longest fire <span class="u">(hours)</span><input type="number" min="0" step="0.5" data-unlock="longestFire" value="${round(u.longestFire / 3600, 2)}"></label>`;
  return `<div class="grid2"><label class="f">In the shop from<select data-unlock-kind>
    ${[['', 'The start'], ['firesCompleted', 'After some fires burn out'], ['milestone', 'After a milestone'], ['discovered', 'After finding something'], ['burned', 'After burning something'], ['longestFire', 'After a long enough fire']].map(([k, n]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${n}</option>`).join('')}
  </select></label>${val}</div>`;
}
function recipeTable(o) {
  const rows = Object.entries(o.recipe || {});
  const opts = (id) => work.materials.filter((m) => m !== o).map((m) => `<option value="${m.id}" ${m.id === id ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
  return `<p class="help">Shown in the shop with a Make button; it uses these up instead of Sparks.</p>
  <div class="tablewrap"><table class="rows"><thead><tr><th>Material</th><th>How many</th><th></th></tr></thead><tbody>
    ${rows.map(([id, n], i) => `<tr><td><select data-recipe-id="${i}">${opts(id)}</select></td>
      <td><input type="number" min="1" data-recipe-n="${i}" value="${n}"></td>
      <td class="x"><button class="btn small danger" data-act="recipe-del" data-i="${i}" aria-label="Remove">✕</button></td></tr>`).join('')}
  </tbody></table></div><div><button class="btn small" data-act="recipe-add">+ Add a material</button></div>`;
}
function setRecipeRows(o, rows) { o.recipe = Object.fromEntries(rows.filter(([id]) => id)); }
function lootTable(o) {
  const opts = (id) => [...work.items, ...work.materials].map((d) => `<option value="${d.id}" ${d.id === id ? 'selected' : ''}>${esc(d.name)}</option>`).join('');
  return `<div class="tablewrap"><table class="rows"><thead><tr><th>Find</th><th>Chance per roll %</th><th>Min</th><th>Max</th><th></th></tr></thead><tbody>
    ${o.loot.map((l, i) => `<tr><td><select data-k="loot.${i}.item" data-t="text">${opts(l.item)}</select></td>
      <td><input type="number" min="0" max="100" step="0.1" data-k="loot.${i}.chance" data-t="pct" value="${fromVal.pct(l.chance)}"></td>
      <td><input type="number" min="1" data-k="loot.${i}.min" data-t="int" value="${l.min}"></td>
      <td><input type="number" min="1" data-k="loot.${i}.max" data-t="int" value="${l.max}"></td>
      <td class="x"><button class="btn small danger" data-act="loot-del" data-i="${i}" aria-label="Remove">✕</button></td></tr>`).join('')}
  </tbody></table></div><div><button class="btn small" data-act="loot-add">+ Add a find</button></div>`;
}
function materialForm(o) {
  return `
  ${headHtml(iconSrc(o), o, statusPill('materials', o))}
  <div class="card"><h3>Basics</h3>
    <div class="grid2">${field('Name', 'name')}${idField('materials')}
      ${selectField('Category', 'category', CATEGORIES.map((c) => [c, c]))}${selectField('Rarity', 'rarity', RARITIES.map((r) => [r, r]))}</div>
    <label class="f">Description<textarea data-k="description" data-t="text">${esc(o.description)}</textarea></label>
  </div>
  <div class="card"><h3>Burning</h3>
    <div class="grid3">${field('Burn time', 'burnSeconds', 'min', 'min="0" step="1"', 'minutes')}${field('Heat', 'heat', 'num', 'step="0.5"')}${field('Quality', 'quality', 'num', 'step="0.5"')}${field('Essence', 'essence', 'num', 'step="0.5"')}${field('Ash yield', 'ashYield', 'int', 'min="0"', 'reward rolls')}</div>
    <p class="help">Heat favours fiery finds and Ember Cores, quality favours rarer finds, essence favours magical ones.</p>
  </div>
  <div class="card"><h3>Shop</h3>
    <div class="seg" role="group"><button data-act="pay-mode" data-mode="sparks" aria-pressed="${!o.recipe}">Bought with Sparks</button><button data-act="pay-mode" data-mode="recipe" aria-pressed="${!!o.recipe}">Made from materials</button></div>
    ${o.recipe ? recipeTable(o) : `<div class="grid2">${field('Price', 'price', 'null-int', 'min="0"', 'Sparks — leave empty if not sold')}</div>`}
    ${unlockFields(o)}
  </div>
  <div class="card"><h3>Ash rewards</h3><p class="help">Each roll checks every row separately. Ash yield sets how many rolls one of these makes.</p>${lootTable(o)}</div>
  <div class="card"><h3>Special</h3>
    <div class="grid2">${selectField('Flame colour while burning', 'flameTint', [['', 'Normal'], ['red', 'Red']])}
      ${o.flameTint ? selectField('Colour lasts', 'flameTintLasts', [['', 'While it burns'], ['fire', 'The rest of the fire']]) : ''}</div>
    <div class="grid2">${field('Puts the fire out after', 'extinguishAfterSeconds', 'opt-min', 'min="0"', 'minutes — empty for never')}</div>
    ${o.extinguishAfterSeconds ? `<label class="check"><input type="checkbox" data-once ${o.extinguishOnce ? 'checked' : ''}> Only the first time one is ever burned</label>` : ''}
    ${field('Message when it does', 'extinguishMessage', 'opt-text')}
    <div class="grid2">${field('Makes the fire bigger by', 'fireGrowth', 'opt-pct', 'min="0" step="1"', '% each — empty for no change')}
      ${field('Too hot to approach after', 'tooHotAt', 'opt-int', 'min="1"', 'in one fire — empty for never')}</div>
    ${field('Message when stoking is refused', 'tooHotMessage', 'opt-text')}
    <div class="grid3">${field('Guaranteed find after', 'guarantee.count', 'opt-int', 'min="1"', 'in one fire')}
      <label class="f">Guaranteed find<select data-guarantee-item><option value="">None</option>${[...work.items, ...work.materials].map((d) => `<option value="${d.id}" ${o.guarantee && o.guarantee.item === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      ${field('At least', 'guarantee.qty', 'opt-int', 'min="1"')}</div>
    <label class="check"><input type="checkbox" data-burn-alone ${o.burnAlone === false ? 'checked' : ''}> Won't burn on its own (needs other fuel in the same stoke)</label>
    ${o.burnAlone === false ? field('Message when tried alone', 'burnAloneMessage', 'opt-text') : ''}
  </div>
  ${iconCard(o)}
  ${deleteBlock('material')}`;
}
/* ash items */
function itemForm(o) {
  const droppedBy = work.materials.filter((m) => m.loot.some((l) => l.item === o.id)).map((m) => m.name);
  return `
  ${headHtml(iconSrc(o), o, statusPill('items', o))}
  <div class="card"><h3>Basics</h3>
    <div class="grid2">${field('Name', 'name')}${idField('items')}${selectField('Rarity', 'rarity', RARITIES.map((r) => [r, r]))}
      ${selectField('Kind', 'kind', [['treasure', 'Treasure (sold for Sparks)'], ['core', 'Ember Core (adds to Cores)']])}
      ${field('Sell value', 'value', 'int', 'min="0"', 'Sparks')}</div>
    <div class="inline"><label class="check"><input type="checkbox" data-tag="heat" ${(o.tags || []).includes('heat') ? 'checked' : ''}> Boosted by heat</label>
      <label class="check"><input type="checkbox" data-tag="magic" ${(o.tags || []).includes('magic') ? 'checked' : ''}> Boosted by essence (magical)</label></div>
    <label class="f">Description<textarea data-k="description" data-t="text">${esc(o.description)}</textarea></label>
    <p class="help">${droppedBy.length ? `Found in the ashes of ${esc(droppedBy.join(', '))}.` : 'Not in any material\'s ash rewards yet — add it to one on the Materials tab.'}</p>
  </div>
  ${iconCard(o)}
  ${deleteBlock('ash item')}`;
}
/* icon card shared by materials and items */
function iconCard(o) {
  const art = !!(o.icon && o.icon.art);
  const pal = (!art && o.icon && o.icon.palette) || ['#1a0c06', '#6a2e10', '#c0602a', '#f0a040', '#ffe6a0'];
  const roles = ['Outline', 'Dark', 'Mid', 'Light', 'Highlight'];
  return `<div class="card"><h3>Icon</h3>
    <div class="seg" role="group"><button data-act="icon-mode" data-mode="shape" aria-pressed="${!art}">Generated shape</button><button data-act="icon-mode" data-mode="art" aria-pressed="${art}">Pixel art</button></div>
    ${art ? `<div data-pixel="icon.art" data-max="48"></div>` : `
      <div class="grid2"><label class="f">Shape<select data-k="icon.shape" data-t="text">${SHAPES.map((s) => `<option ${o.icon && o.icon.shape === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
      <div class="inline">${pal.map((c, i) => `<label class="f" style="width:84px">${roles[i]}<input type="color" data-k="icon.palette.${i}" data-t="text" value="${esc(c)}"></label>`).join('')}</div>
      <p class="help">Switch to Pixel art to draw it yourself, starting from this shape, or to import a PNG.</p>`}
  </div>`;
}
/* upgrades */
function effectFields(o) {
  const e = o.effect || {}; const t = e.type;
  const pct = (label, path) => field(label, `effect.${path}`, 'pct', 'step="0.5"', '% per level');
  if (t === 'capacity') return `<p class="help">Uses the stoking capacity table in config: ${esc(CONFIG.capacityByLevel.join(' → '))} slots. Give it ${CONFIG.capacityByLevel.length - 1} levels at most.</p>`;
  if (t === 'burnCategory') return `<div class="grid2">${selectField('Category', 'effect.category', CATEGORIES.map((c) => [c, c]))}${pct('Longer burn', 'perLevel')}</div>`;
  if (['burnAll', 'heat', 'quality', 'rolls'].includes(t)) return `<div class="grid2">${pct('Bonus', 'perLevel')}</div>`;
  if (t === 'preservation') return `<div class="grid2">${field('Stoke earlier by', 'effect.thresholdPerLevel', 'min', 'step="1"', 'minutes per level')}${pct('More essence', 'essencePerLevel')}</div>`;
  if (t === 'tagChance') return `<div class="grid2">${selectField('Finds', 'effect.tag', [['magic', 'Magical (essence)'], ['heat', 'Fiery (heat)']])}${pct('Better chance', 'perLevel')}</div>`;
  if (t === 'rarityChance') return `<div class="inline">${RARITIES.map((r) => `<label class="check"><input type="checkbox" data-rarity="${r}" ${(e.rarities || []).includes(r) ? 'checked' : ''}> ${r}</label>`).join('')}</div><div class="grid2">${pct('Better chance', 'perLevel')}</div>`;
  if (t === 'forageFinds') {
    const finds = e.finds || [];
    return `<p class="help">Once bought, each twig or leaf that falls on the forage patch has this chance to be one of these instead.</p>
    <div class="tablewrap"><table class="rows"><thead><tr><th>Material</th><th>Chance %</th><th></th></tr></thead><tbody>
      ${finds.map((f, i) => `<tr><td><select data-k="effect.finds.${i}.id" data-t="text">${work.materials.map((m) => `<option value="${m.id}" ${m.id === f.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></td>
      <td><input type="number" min="0" max="100" step="0.1" data-k="effect.finds.${i}.chance" data-t="pct" value="${fromVal.pct(f.chance)}"></td>
      <td class="x"><button class="btn small danger" data-act="find-del" data-i="${i}" aria-label="Remove">✕</button></td></tr>`).join('')}
    </tbody></table></div><div><button class="btn small" data-act="find-add">+ Add a find</button></div>`;
  }
  return '';
}
function upgradeForm(o) {
  const mode = o.iconArt ? 'art' : o.iconSprite ? 'sprite' : 'shape';
  return `
  ${headHtml(upgradeIconSrc(o), o, statusPill('upgrades', o))}
  <div class="card"><h3>Basics</h3>
    <div class="grid2">${field('Name', 'name')}${idField('upgrades')}${selectField('Section', 'group', work.groups.map((g) => [g.id, g.name]))}</div>
    <label class="f">Description<textarea data-k="description" data-t="text">${esc(o.description)}</textarea></label>
  </div>
  <div class="card"><h3>What it does</h3>
    <label class="f">Effect<select data-effect-type>${Object.entries(EFFECTS).map(([k, n]) => `<option value="${k}" ${o.effect && o.effect.type === k ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
    ${effectFields(o)}
    <p class="help">To show something at the campsite when this is bought, add an overlay on the Campsite tab and set it to appear after this upgrade.</p>
  </div>
  <div class="card"><h3>When it can be bought</h3>${requiresFields(o, 'Can be bought', 'From the start')}
    <p class="help">Until then the game shows it locked, with what's needed to unlock it.</p></div>
  <div class="card"><h3>Cost per level</h3>
    <div class="tablewrap"><table class="rows"><thead><tr><th>Level</th><th>Sparks</th><th>Ember Cores</th><th></th></tr></thead><tbody>
    ${o.costs.map((c, i) => `<tr><td class="mono">${i + 1}</td><td><input type="number" min="0" data-k="costs.${i}.sparks" data-t="int" value="${c.sparks || 0}"></td>
      <td><input type="number" min="0" data-k="costs.${i}.cores" data-t="int" value="${c.cores || 0}"></td>
      <td class="x"><button class="btn small danger" data-act="cost-del" data-i="${i}" ${o.costs.length < 2 ? 'disabled' : ''} aria-label="Remove level">✕</button></td></tr>`).join('')}
    </tbody></table></div><div><button class="btn small" data-act="cost-add">+ Add a level</button></div>
    <p class="help">One level makes it a one-time purchase (Buy / Owned).</p>
  </div>
  <div class="card"><h3>Icon</h3>
    <div class="seg" role="group">${[['shape', 'Generated shape'], ['sprite', 'Game sprite'], ['art', 'Pixel art']].map(([m, n]) => `<button data-act="up-icon-mode" data-mode="${m}" aria-pressed="${mode === m}">${n}</button>`).join('')}</div>
    ${mode === 'shape' ? `<div class="grid2"><label class="f">Shape<select data-k="icon" data-t="text">${SHAPES.map((s) => `<option ${o.icon === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div><p class="help">Coloured with its section's palette.</p>` : ''}
    ${mode === 'sprite' ? `<div class="grid2"><label class="f">Sprite<select data-k="iconSprite" data-t="text">${SPRITE_NAMES.map((s) => `<option ${o.iconSprite === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>` : ''}
    ${mode === 'art' ? '<div data-pixel="iconArt" data-max="48"></div>' : ''}
  </div>
  ${deleteBlock('upgrade')}`;
}
function groupsForm() {
  return `<div class="card"><h3>Upgrade sections</h3><p class="help">Each section is a heading on the game's Upgrades page. Its palette colours the generated upgrade icons inside it.</p>
    ${work.groups.map((g, i) => `<div class="card" style="background:var(--panel-2)">
      <div class="grid2"><label class="f">Name<input type="text" data-g="${i}" data-gk="name" value="${esc(g.name)}"></label>
        <label class="f">ID<input type="text" value="${esc(g.id)}" ${BASE.config.upgradeGroups.some((x) => x.id === g.id) ? 'disabled' : `data-g="${i}" data-gk="id"`}></label></div>
      <label class="f">Text under the heading<input type="text" data-g="${i}" data-gk="blurb" value="${esc(g.blurb)}"></label>
      <div class="inline">${(g.iconPalette || []).map((c, j) => `<input type="color" aria-label="Palette colour ${j + 1}" data-g="${i}" data-gk="iconPalette.${j}" value="${esc(c)}">`).join('')}
        <span class="help" style="margin:0">${work.upgrades.filter((u) => u.group === g.id).length} upgrades</span>
        ${work.upgrades.some((u) => u.group === g.id) ? '' : `<button class="btn small danger" data-act="group-del" data-i="${i}">Delete section</button>`}</div>
    </div>`).join('')}
    <div><button class="btn small" data-act="group-add">+ New section</button></div></div>`;
}
/* overlays */
function requiresFields(o, label = 'Shows up', always = 'Always') {
  const r = o.requires || null;
  const kind = !r ? '' : r.upgrade ? 'upgrade' : r.milestone ? 'milestone' : r.discovered ? 'discovered' : r.firesCompleted !== undefined ? 'firesCompleted' : '';

  else if (act === 'find-del') { o.effect.finds.splice(Number(b.dataset.i), 1); afterChange(); }
  else if (act === 'cost-add') { const last = o.costs[o.costs.length - 1] || { sparks: 100 }; o.costs.push({ sparks: Math.round((last.sparks || 100) * 2), ...(last.cores ? { cores: last.cores + 1 } : {}) }); afterChange(); }
  else if (act === 'cost-del') { o.costs.splice(Number(b.dataset.i), 1); afterChange(); }
  else if (act === 'icon-mode') {

    afterChange();
  } else if (act === 'up-icon-mode') {

    if (m === 'shape') o.icon = o.icon || 'flame';
    if (m === 'sprite') o.iconSprite = SPRITE_NAMES[0];

  else if (act === 'group-add') { work.groups.push({ id: uniqueId('new_section', new Set(work.groups.map((g) => g.id))), name: 'New Section', blurb: '', iconPalette: ['#1a0c06', '#6a2e10', '#c0602a', '#f0a040', '#ffe6a0'] }); afterChange(); }
  else if (act === 'group-del') { work.groups.splice(Number(b.dataset.i), 1); afterChange(); }

  } else if (act === 'copy') {
    const text = JSON.stringify(bundle(), null, 2);

  } else if (act === 'show-json') { showJson(JSON.stringify(bundle(), null, 2)); }

  else if (act === 'reset-no') { render(); }
});
function showJson(text, select) {
